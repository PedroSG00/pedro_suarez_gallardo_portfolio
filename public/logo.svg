<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 560" width="720" height="560" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="left"><rect x="0" y="0" width="34" height="64"/></clipPath>
    <clipPath id="right"><rect x="34" y="0" width="30" height="64"/></clipPath>

    <!-- D: stem + cursor, no container -->
    <symbol id="d" viewBox="0 0 64 64">
      <rect x="18" y="8" width="9" height="48" fill="currentColor"/>
      <rect x="32" y="8" width="18" height="26" fill="currentColor"/>
    </symbol>

    <!-- E: solid / outline P, no container -->
    <symbol id="e" viewBox="0 0 64 64">
      <path clip-path="url(#left)" fill="currentColor" fill-rule="evenodd" d="M16 8H50V36H27V56H16Z M27 17H39V27H27Z"/>
      <path clip-path="url(#right)" fill="none" stroke="currentColor" stroke-width="1.5" d="M16 8H50V36H27V56H16Z M27 17H39V27H27Z"/>
    </symbol>

    <!-- F: stem + cursor crossing a hairline baseline (grid) -->
    <symbol id="f" viewBox="0 0 64 64">
      <rect x="2" y="47" width="60" height="1.5" fill="currentColor"/>
      <rect x="18" y="8" width="9" height="52" fill="currentColor"/>
      <rect x="32" y="8" width="18" height="26" fill="currentColor"/>
    </symbol>
  </defs>

  <rect width="720" height="280" fill="#F2EFE6"/>
  <rect y="280" width="720" height="280" fill="#121110"/>

  <g color="#121110">
    <use xlink:href="#d" x="40"  y="20" width="150" height="150"/>
    <use xlink:href="#e" x="280" y="20" width="150" height="150"/>
    <use xlink:href="#f" x="520" y="20" width="150" height="150"/>
    <use xlink:href="#d" x="40"  y="200" width="28" height="28"/>
    <use xlink:href="#d" x="90"  y="206" width="16" height="16"/>
    <use xlink:href="#e" x="280" y="200" width="28" height="28"/>
    <use xlink:href="#e" x="330" y="206" width="16" height="16"/>
    <use xlink:href="#f" x="520" y="200" width="28" height="28"/>
    <use xlink:href="#f" x="570" y="206" width="16" height="16"/>
  </g>

  <g color="#F2EFE6">
    <use xlink:href="#d" x="40"  y="300" width="150" height="150"/>
    <use xlink:href="#e" x="280" y="300" width="150" height="150"/>
    <use xlink:href="#f" x="520" y="300" width="150" height="150"/>
    <use xlink:href="#d" x="40"  y="480" width="28" height="28"/>
    <use xlink:href="#d" x="90"  y="486" width="16" height="16"/>
    <use xlink:href="#e" x="280" y="480" width="28" height="28"/>
    <use xlink:href="#e" x="330" y="486" width="16" height="16"/>
    <use xlink:href="#f" x="520" y="480" width="28" height="28"/>
    <use xlink:href="#f" x="570" y="486" width="16" height="16"/>
  </g>

  <g font-family="monospace" font-size="12">
    <g fill="#5A574F">
      <text x="40"  y="268">D · tallo + cursor</text>
      <text x="280" y="268">E · sólido / contorno</text>
      <text x="520" y="268">F · cursor sobre la retícula</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
