# SonarQube Cloud project configuration
# Repository: PedroSG00/pedro_suarez_gallardo_portfolio

sonar.projectKey=PedroSG00_pedro_suarez_gallardo_portfolio
sonar.organization=pedrosg00
sonar.projectName=pedro_suarez_gallardo_portfolio
sonar.projectDescription=Portfolio of Pedro Suarez Gallardo, full-stack web developer

# Production source lives under src/. Unit tests and Playwright specs are indexed
# as tests so their lines do not count as production code or reduce coverage.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Coverage report produced by `pnpm test` (Vitest, v8 provider).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions: identical to `test.coverage.exclude` in vitest.config.mts.
# Change both files together; src/app/ is analyzed but not measured.
# Root-level tooling/config files are not application logic and are not measured
# by Vitest. src/proxy.ts and src/app/** are exercised by Playwright e2e,
# not by Vitest unit tests, so they carry no unit coverage.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.d.ts,*.config.*,check-package-manager.mjs,e2e/**,src/app/**,src/proxy.ts,src/test/**,src/content/**

# Duplication is only waived for tests, e2e flows and translation messages.
# e2e specs and messages/*.json repeat phrasing by design (bilingual parity).
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,e2e/**,messages/**

# Fail the job when the quality gate fails, waiting up to 300 seconds.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
