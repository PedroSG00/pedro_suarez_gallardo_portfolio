# SonarQube Cloud project configuration
# Repository: PedroSG00/pedro_suarez_gallardo_portfolio

sonar.projectKey=PedroSG00_pedro_suarez_gallardo_portfolio
sonar.organization=Pedro Suárez Gallardo
sonar.projectName=pedro_suarez_gallardo_portfolio
sonar.projectDescription=Portfolio y currículum de Pedro Suárez Gallardo — desarrollador web

# Lenguaje principal
sonar.language=ts

# Carpetas de código fuente real (excluye tests, specs, docs, scripts de utilidad y dependencias)
sonar.sources=app, middleware, proxy.ts

# Reportes de cobertura (Vitest genera lcov en coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Tests de Vitest (unitarios y de componente)
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclusiones: dependencias, build, tests, specs, docs, scripts, configuración y assets
sonar.exclusions=node_modules/**,.next/**,out/**,build/**,.git/**,coverage/**,test-results/**,tests/**,specs/**,docs/**,scripts/**,public/**,*.min.js,*.min.css,pnpm-lock.yaml,*.tsbuildinfo,next-env.d.ts,vitest.config.ts,playwright.config.ts,playwright.config.test.ts,next.config.ts,tsconfig.json,eslint.config.mjs,README.md,AGENTS.md,.gitignore,pnpm-workspace.yaml
